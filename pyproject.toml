[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "worklog"
version = "0.1.0"
description = "Time tracker / worklog desktop app for Ubuntu and Windows"
requires-python = ">=3.11"
dependencies = [
    "PyQt6>=6.7",
    "PyQt6-Charts>=6.7",
    "keyring>=24",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-qt>=4"]
hotkey = ["pynput>=1.7"]
windows = ["pyinstaller>=6"]

[project.scripts]
worklog = "worklog.app:main"

[tool.setuptools.packages.find]
include = ["worklog*"]

[tool.setuptools.package-data]
worklog = ["resources/icons/*.svg"]

[tool.pytest.ini_options]
testpaths = ["tests"]
